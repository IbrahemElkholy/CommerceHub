services:

  postgres:
    image: postgres:18-alpine
    container_name: commercehub-postgres
    environment:
      POSTGRES_DB: commercehub
      POSTGRES_USER: commercehub
      POSTGRES_PASSWORD: commercehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercehub -d commercehub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: commercehub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: commercehub-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
